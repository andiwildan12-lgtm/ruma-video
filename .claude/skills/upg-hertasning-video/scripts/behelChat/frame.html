<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--o:#E8771E;--d:#262626;--c:#FFF4E8;--p:#FCE3CC}
body{width:1080px;height:1920px;overflow:hidden;font-family:Inter,sans-serif;position:relative;background:#111;color:var(--d)}
.bg{position:absolute;inset:0;width:1080px;height:1920px;object-fit:cover}
.sh{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.35) 0%,rgba(0,0,0,.05) 30%,rgba(0,0,0,0) 60%,rgba(0,0,0,.3) 100%)}
/* panel chat */
.chat{position:absolute;left:60px;right:60px;top:290px;background:#F4EFE9;border-radius:36px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.chat .hd{background:var(--o);color:#fff;display:flex;align-items:center;gap:18px;padding:20px 26px}
.chat .av{width:70px;height:70px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center}
.chat .av img{width:52px}
.chat .nm{font-size:34px;font-weight:800}.chat .on{font-size:22px;opacity:.9}
.chat .bd{padding:26px 24px 30px;display:flex;flex-direction:column;gap:16px}
.in{align-self:flex-start;background:#fff;border-radius:6px 28px 28px 28px;padding:18px 26px;font-size:40px;font-weight:700;max-width:86%;box-shadow:0 3px 8px rgba(0,0,0,.08)}
.in small,.out small{display:block;text-align:right;font-size:20px;color:#999;font-weight:600;margin-top:4px}
.out{align-self:flex-end;background:var(--p);border-radius:28px 6px 28px 28px;padding:18px 26px;font-size:40px;font-weight:800;max-width:86%}
.out small{color:#b36b2c}
.cnt{position:absolute;top:22px;right:26px;background:#fff;color:var(--o);font-weight:900;font-size:26px;border-radius:30px;padding:4px 14px}
/* pertanyaan di atas footage */
.q{position:absolute;left:60px;top:300px;max-width:820px;background:#fff;border-radius:6px 30px 30px 30px;padding:20px 30px;font-size:46px;font-weight:800;box-shadow:0 12px 34px rgba(0,0,0,.3)}
.q .lb{display:block;font-size:22px;color:var(--o);font-weight:900;letter-spacing:2px;margin-bottom:6px}
/* tabel harga */
.tbl{position:absolute;left:70px;right:70px;top:500px;background:#fff;border-radius:30px;padding:26px 34px;box-shadow:0 18px 50px rgba(0,0,0,.35)}
.tbl .tt{font-size:28px;font-weight:900;color:#8a3f0a;letter-spacing:3px;margin-bottom:8px}
.tbl .r{display:flex;justify-content:space-between;align-items:baseline;padding:14px 0;border-bottom:3px dashed #eedccb;font-size:46px;font-weight:800}
.tbl .r:last-of-type{border:none}
.tbl .r b{color:var(--o);font-size:62px;font-weight:900}
.tbl .fn{font-size:22px;color:#8a3f0a;font-weight:600;margin-top:8px}
/* kalkulator */
.calc{position:absolute;left:70px;right:70px;top:500px;background:var(--d);color:#fff;border-radius:30px;padding:30px 36px;box-shadow:0 18px 50px rgba(0,0,0,.35)}
.calc .l{font-size:30px;font-weight:700;opacity:.8}
.calc .v{font-size:76px;font-weight:900;letter-spacing:-1px;margin-bottom:10px}
.calc .v.o{color:#FFA552}
.calc .ar{font-size:40px;opacity:.6;margin:-4px 0 4px}
.calc .badge{display:inline-block;background:var(--o);color:#fff;font-size:40px;font-weight:900;padding:10px 28px;border-radius:40px;margin-top:6px}
/* centang */
.ck{position:absolute;left:60px;top:470px;display:flex;flex-direction:column;gap:12px}
.ck div{background:#fff;border-radius:40px;padding:12px 26px 12px 14px;font-size:40px;font-weight:800;display:flex;align-items:center;gap:14px;box-shadow:0 8px 20px rgba(0,0,0,.25)}
.ck div:before{content:'✓';width:52px;height:52px;border-radius:50%;background:var(--o);color:#fff;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:900}
.ck div.off{opacity:.45}.ck div.off:before{background:#bbb}
.st{position:absolute;background:#fff;border-radius:22px;padding:18px 26px;font-size:46px;font-weight:900;box-shadow:0 12px 30px rgba(0,0,0,.3);display:flex;align-items:center;gap:14px}
.end{position:absolute;inset:0;background:var(--c);display:flex;flex-direction:column;align-items:center;padding-top:320px;text-align:center;overflow:hidden}
.end .blob{position:absolute;width:700px;height:700px;border-radius:50%;background:var(--p);top:-200px;right:-260px}
.end .blob2{position:absolute;width:520px;height:520px;border-radius:50%;background:var(--p);bottom:-160px;left:-200px}
.end img,.end div{position:relative}
.end img{width:300px}
.end .hz{color:#fff;font-weight:900;letter-spacing:10px;font-size:34px;background:var(--o);padding:6px 18px 7px 28px;border-radius:10px;margin-top:10px}
.end .t1{font-size:64px;font-weight:900;margin-top:46px}
.end .t2{font-size:118px;font-weight:900;color:var(--o);line-height:1;letter-spacing:-3px}.end .t2 small{font-size:50px;color:#8a3f0a}
.end .t3{font-size:38px;font-weight:800;background:var(--d);color:#fff;padding:10px 28px;border-radius:40px;margin-top:18px}
.end .t4{font-size:56px;font-weight:900;margin-top:42px}
.end .t5{font-size:32px;font-weight:700;margin-top:10px;line-height:1.5}
</style></head><body><div id="r"></div>
<script>
const P=+new URLSearchParams(location.search).get('p');
const bg=f=>`<img class="bg" src="${f}"><div class="sh"></div>`;
const head=`<div class="hd"><div class="av"><img src="logo_upg_oranye.png"></div><div><div class="nm">Admin UPG Hertasning</div><div class="on">online</div></div></div>`;
const q=(n,t)=>`<div class="q"><span class="lb">PERTANYAAN ${n}/3</span>${t}</div>`;
const ck=n=>`<div class="ck">${['Konsultasi dokter gigi','Cetak gigi','Scaling','Dipasang dokter gigi'].map((t,i)=>`<div class="${i<n?'':'off'}">${t}</div>`).join('')}</div>`;
const S={
1:bg('blur_3503.jpg')+`<div class="chat">${head}<div class="cnt">3 pesan baru</div><div class="bd"><div class="in">Kak, pasang behel berapa?<small>19.02</small></div><div class="in">Bisa dicicil nggak?<small>19.02</small></div><div class="in">Udah termasuk apa aja?<small>19.03</small></div></div></div>`,
2:bg('blur_3498.jpg')+q(1,'Kak, pasang behel berapa?')+`<div class="tbl"><div class="tt">HARGA PER RAHANG</div><div class="r">Metal<b>Rp3 jt</b></div><div class="r">Keramik<b>Rp3,5 jt</b></div><div class="r">Self&#8209;ligating<b>Rp4,5 jt</b></div><div class="fn">*harga mulai · S&amp;K berlaku</div></div>`,
3:bg('blur_3498.jpg')+q(2,'Bisa dicicil nggak?')+`<div class="calc"><div class="l">Contoh: metal 1 rahang</div><div class="v">Rp3.000.000</div><div class="ar">↓</div><div class="l">DP 50%</div><div class="v o">Rp1.500.000</div><div class="ar">↓</div><div class="l">Sisanya 2× per bulan</div><div class="v o">2 × Rp750.000</div><div class="badge">tanpa bunga</div></div>`,
4:bg('behel_3484.jpg')+q(3,'Udah termasuk apa aja?')+ck(1),
5:bg('behel_3486.jpg')+q(3,'Udah termasuk apa aja?')+ck(2),
6:bg('scaling_3224.jpg')+q(3,'Udah termasuk apa aja?')+ck(3),
7:bg('behel_3489.jpg')+q(3,'Udah termasuk apa aja?')+ck(4),
8:bg('suasana_3476.jpg')+`<div class="st" style="left:60px;top:330px;transform:rotate(-3deg)">🍪 Camilan</div><div class="st" style="left:330px;top:460px;transform:rotate(3deg)">🍦 Es krim</div><div class="st" style="left:110px;top:590px;transform:rotate(-2deg)">📖 Pojok baca</div>`,
9:bg('blur_3503.jpg')+`<div class="chat">${head}<div class="bd"><div class="in">Udah termasuk apa aja?<small>19.03</small></div><div class="out">Konsultasi, cetak gigi & scaling sudah termasuk ya Kak 😊<small>19.04 ✓✓</small></div><div class="in" style="font-size:64px;letter-spacing:4px;font-weight:900">BEHEL<small>19.05</small></div><div class="out">Siap Kak, admin bantu atur jadwalnya ya 🙏<small>19.05 ✓✓</small></div></div></div>`,
10:`<div class="end"><div class="blob"></div><div class="blob2"></div><img src="logo_upg_oranye.png"><div class="hz">HERTASNING</div><div class="t1">Pasang Behel</div><div class="t2">Rp3 jt<small>/rahang</small></div><div class="t3">DP 50% · cicil 2× tanpa bunga</div><div class="t4">💬 0896-7341-5806</div><div class="t5">📍 Jl. Letjen Hertasning No.50, Makassar<br>⏰ Setiap hari 10.00–22.00 WITA</div></div>`};
document.getElementById('r').innerHTML=S[P];
</script></body></html>
