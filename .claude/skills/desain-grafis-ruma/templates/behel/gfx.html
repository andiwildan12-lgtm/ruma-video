<!doctype html><html><head><meta charset=utf-8><style>
@font-face{font-family:P;src:url(fonts/poppins-latin-500-normal.woff2);font-weight:500}
@font-face{font-family:P;src:url(fonts/poppins-latin-600-normal.woff2);font-weight:600}
@font-face{font-family:P;src:url(fonts/poppins-latin-700-normal.woff2);font-weight:700}
@font-face{font-family:O;src:url(fonts/open-sans-latin-400-normal.woff2);font-weight:400}
@font-face{font-family:O;src:url(fonts/open-sans-latin-600-normal.woff2);font-weight:600}
*{box-sizing:border-box;margin:0}
body{width:1080px;height:var(--H);background:#fff;position:relative;overflow:hidden;font-family:O,sans-serif;color:#354B49}
.bgm{position:absolute;left:0;right:0;bottom:0;height:var(--mint);background:#E8F8F6}
.hd{position:absolute;left:64px;right:64px;top:var(--top);display:flex;justify-content:space-between;align-items:center}
.hd img{height:86px}.hd .loc{font:600 26px P;color:#354B49;border:2.5px solid #28CDBD;border-radius:40px;padding:8px 22px}
.kick{display:inline-block;font:600 28px P;background:#354B49;color:#fff;padding:8px 20px 10px;border-radius:10px}
.h1{font:700 var(--fs)/1.05 P;color:#354B49;letter-spacing:-1.5px;margin-top:18px}
.h2{display:inline-block;font:700 var(--fs2)/1.1 P;color:#354B49;background:#28CDBD;padding:4px 20px 12px;border-radius:14px;margin-top:10px;letter-spacing:-1px}
.sub{font:400 30px/1.4 O;color:#354B49;margin-top:18px}
.ph{position:absolute;overflow:hidden;clip-path:polygon(0 10%,50% 0,100% 10%,100% 100%,0 100%);border-radius:0 0 26px 26px}
.ph img{width:100%;height:100%;object-fit:cover}
.card{position:absolute;background:#fff;border-radius:26px;box-shadow:0 14px 36px rgba(53,75,73,.16);padding:28px 30px}
.pr .m{font:500 28px O;color:#5E6B67}.pr .big{font:700 84px/1 P;color:#354B49;letter-spacing:-2px}
.pr .r{font:600 30px P;color:#354B49;margin-top:8px}.pr .chip{display:inline-block;font:600 28px P;background:#28CDBD;color:#354B49;padding:8px 18px 10px;border-radius:12px;margin-top:14px}
.inc{margin-top:20px;border-top:2px solid #E8F8F6;padding-top:16px}.inc .t{font:600 24px P;color:#5E6B67}
.inc ul{list-style:none;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;margin-top:8px}
.inc li{font:600 24px/1.3 O;color:#354B49;display:flex;gap:10px;align-items:flex-start}.inc li:before{content:'✓';flex:none;width:30px;height:30px;border-radius:50%;background:#28CDBD;color:#354B49;font:700 18px/30px P;text-align:center}
.steps .s{display:flex;gap:18px;align-items:center;margin:10px 0}.steps .n{flex:none;width:60px;height:60px;border-radius:50%;background:#28CDBD;font:700 32px P;display:grid;place-items:center}
.steps b{display:block;font:600 32px/1.2 P}.steps span{font:400 24px/1.3 O;color:#5E6B67}
.cm{position:absolute;background:#fff;border-radius:22px;padding:18px 24px 22px;box-shadow:0 10px 28px rgba(0,0,0,.2)}
.cm .hd2{display:flex;gap:10px;align-items:center;font:500 22px O;color:#7A8784}.cm .av{width:34px;height:34px;border-radius:50%;background:#D9E3E1}
.cm .tx{font:600 34px/1.25 P;color:#354B49;margin-top:6px}
.ft{position:absolute;left:64px;right:64px;bottom:var(--fb);display:flex;justify-content:space-between;align-items:center;gap:20px}
.cta{font:600 36px P;background:#28CDBD;color:#354B49;padding:16px 30px 18px;border-radius:16px;white-space:nowrap}
.cta small{display:block;font:600 26px O;color:#354B49;margin-top:2px}
.ad{font:400 24px/1.45 O;color:#354B49;text-align:right}.ad i{display:block;font-style:normal;color:#5E6B67;font-size:22px}
</style></head><body><div id=root></div>
<script>
const INC=['pemasangan atas & bawah','scaling','cetak gigi','foto intra & ekstra oral','konsultasi dokter gigi','ortho kit'];
function price(c){if(c)return `<div class=pr><div class=m>Behel mulai</div><div class=big>Rp6 jutaan</div><div class=r>atas &amp; bawah · Rp3 jt per rahang</div><div class=chip>cicilan Rp2 jt/bln × 3 · tanpa bunga</div><div style="font:400 24px/1.4 O;color:#354B49;margin-top:14px"><b style="font-weight:600">Sudah termasuk:</b> pemasangan atas &amp; bawah · scaling · cetak gigi · foto intra &amp; ekstra oral · konsultasi dokter gigi · ortho kit</div></div>`;return `<div class=pr><div class=m>Behel mulai</div><div class=big>Rp6 jutaan</div><div class=r>atas &amp; bawah · Rp3 jt per rahang</div><div class=chip>cicilan Rp2 jt/bln × 3 · tanpa bunga</div><div class=inc><div class=t>Sudah termasuk:</div><ul>${INC.map(x=>`<li>${x}</li>`).join('')}</ul></div></div>`}
function steps(){return `<div class=steps>${[['1','Konsultasi + foto gigi','dengan dokter gigi'],['2','Dijelaskan sebelum dipasang','jenis behel · lama perawatan · biaya'],['3','Kontrol rutin','sampai perawatan selesai']].map(s=>`<div class=s><div class=n>${s[0]}</div><div><b>${s[1]}</b><span>${s[2]}</span></div></div>`).join('')}</div>`}
const V={
 B:{img:'adm_2.2.jpg',pos:'50% 18%',posS:'50% 43%',kick:'Spil harga behel',h1:'Pasang behel',h2:'bisa dicicil.',sub:'Tanpa bunga, sudah termasuk paket lengkap.',body:price,cm:true,cta:'Chat admin'},
 C:{img:'klinik.jpg',pos:'50% 45%',posS:'50% 42%',kick:'Behel di Ruma Dental',h1:'Rapikan gigi,',h2:'tanpa harus lunas.',sub:'Dicek dulu, dijelaskan dulu, dikerjakan dokter gigi.',body:price,cta:'Chat admin'},
 M:{img:'konsul.jpg',pos:'40% 50%',kick:'Kenapa behel?',h1:'Gigi berjejal,',h2:'susah dibersihkan.',sub:'Behel menggeser gigi pelan-pelan ke posisi yang lebih rapi. Alurnya di Ruma:',body:steps,cta:'Chat admin, konsultasi dulu'}};
window.go=(k,fmt)=>{const v=V[k],S=fmt=='story';
 document.body.style.cssText=S?'--H:1920px;--top:150px;--fs:84px;--fs2:72px;--fb:300px;--mint:900px':'--H:1350px;--top:44px;--fs:70px;--fs2:58px;--fb:40px;--mint:430px';
 let h='<div class=bgm></div>'+`<div class=hd><img src="card_logo.png"><div class=loc>Klinik Gigi · Makassar</div></div>`;
 const head=`<div class=kick>${v.kick}</div><div class=h1>${v.h1}</div><div class=h2>${v.h2}</div><div class=sub>${v.sub}</div>`;
 if(S){
  const headS=`<div class=kick>${v.kick}</div><div class=h1>${v.h1}</div><div class=h2>${v.h2}</div>`;
  h+=`<div style="position:absolute;left:64px;right:64px;top:270px">${headS}</div>`;
  const pt=v.cm?720:560;const ct=k=='M'?1070:1080;
  if(v.cm)h+=`<div class=cm style="right:64px;width:600px;top:545px"><div class=hd2><div class=av></div>Balas komentar</div><div class=tx>Spil harga pasang behel di Ruma Dental, dong!</div></div><div style="position:absolute;right:190px;top:700px;border-left:22px solid transparent;border-right:22px solid transparent;border-top:26px solid #fff;filter:drop-shadow(0 6px 6px rgba(0,0,0,.12))"></div>`;
  h+=`<div class=ph style="left:0;right:0;top:${pt}px;height:${ct+30-pt}px"><img src="${v.img}" style="object-position:${v.posS||v.pos}"></div>`;
  h+=`<div class=card style="left:56px;right:56px;top:${ct}px">${v.body(true)}</div>`;
 }else{
  h+=`<div style="position:absolute;left:64px;width:520px;top:160px">${head}</div>`;
  h+=`<div class=ph style="left:610px;right:44px;top:150px;height:640px"><img src="${v.img}" style="object-position:${v.pos}"></div>`;
  if(v.cm)h+=`<div class=cm style="left:600px;right:40px;top:250px;padding:14px 20px 18px"><div class=hd2 style="font-size:18px"><div class=av style="width:26px;height:26px"></div>Balas komentar</div><div class=tx style="font-size:26px">Spil harga pasang behel di Ruma Dental, dong!</div></div>`;
  h+=`<div class=card style="left:44px;right:44px;top:${k=="M"?820:675}px;padding:24px 28px">${v.body()}</div>`;
 }
 h+=`<div class=ft><div class=cta>${v.cta}<small>WA 0898-7735-463</small></div><div class=ad>Jl. Rusa No. 65, Maricaya<br>Makassar<i>Tempat Nyaman untuk Kembali Tersenyum</i></div></div>`;
 document.getElementById('root').innerHTML=h;}
</script></body></html>
